# Lint, test, then deploy -- in one workflow so `needs:` actually gates the deploy.
#
# This replaces the previous fly-deploy.yml, which ran `flyctl deploy` on every push
# to main with no checks at all. Deploy must stay in this file: a separate workflow
# keyed on `workflow_run` + `conclusion == success` is defeated by concurrent pushes.
name: CI

on:
  push:
    branches: [main, stg, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that could be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
        name: Lockfile is up to date
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Unit and API tests
        run: |
          uv run --extra dev pytest -m "not integration and not e2e" \
            --cov=src --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: error

  integration:
    # Runs on every PR, not nightly. The atomicity guarantees live in SQL --
    # conditional UPDATEs, partial unique indexes, enum domains, RLS policies --
    # and no in-process fake can prove them. A nightly signal is a signal you
    # ship past.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kwami_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/kwami_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Migrations and money invariants
        run: |
          uv run --extra dev --extra integration pytest -m integration \
            --cov=src --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: coverage.xml
          if-no-files-found: error

  migrations-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Migrations are ordered and unambiguous
        # scripts/migrate.py refuses to run with duplicate version prefixes, which
        # is how 002_billing_accounting_upgrade and 002_user_kwamis came to race.
        # Reusing it here keeps one implementation of the rule.
        run: uv run python scripts/migrate.py --dry-run

  deploy:
    needs: [lint, test, integration, migrations-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
