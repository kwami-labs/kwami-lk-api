# LiveKit TTS & Realtime Voices Configuration
# Last updated: 2026-11-06
#
# This file contains voice definitions for providers that don't expose
# voice types in the LiveKit SDK. Cartesia, Deepgram and Rime are everything each
# provider published on that date (GET /voices, GET /v1/models, Rime's voice list).
# Voices in code (OpenAI, Gemini)
# are defined in src/services/voices.py
#
# Voice structure:
#   id: unique voice identifier (provider-specific)
#   name: display name
#   category: grouping category (e.g., "Female EN", "Male", etc.)
#   gender: male | female | neutral (optional)
#   language: language code (optional)
#   description: additional info (optional)
#   preview_url: a sample to listen to (optional)

tts:
