# fly.toml app configuration file generated for kwami-lk-api on 2026-02-24T21:05:48+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# To run a single machine: fly scale count 1

app = 'kwami-ai-api'
primary_region = 'lhr'

[build]

[env]
  API_HOST = '0.0.0.0'
  API_PORT = '8080'
  APP_ENV = 'production'
  DEBUG = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  # `stop` with min_machines_running = 0 meant the whole service scaled to zero.
  # This one receives Twilio webhooks, which retry on a timeout and give up after
  # a short budget, and issues realtime tokens a user is waiting on -- a cold
  # start is a failed call, not a slow page. `suspend` keeps the machine's memory
  # so a wake is milliseconds, and one machine always stays up.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    # Raised from 25/20. That ceiling was set when every request held the event
    # loop for the duration of its database call, so 25 concurrent requests was
    # roughly 25 blocked ones. The service is now async end to end -- measured at
    # 10 concurrent reads against a 50ms query in 0.02s, against 0.61s before --
    # so a worker can hold far more connections than it has work in flight.
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  # Liveness. Deliberately the shallow endpoint: a dependency outage must not
  # fail every instance's health check and restart the fleet in a loop.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  # Readiness. Checks Supabase and Zep under a 2s budget and answers 503 when one
  # is unreachable, so Fly stops routing to an instance that cannot serve.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health/ready"

[[vm]]
  # Two CPUs because uvicorn now runs two workers (see the Dockerfile): one
  # process cannot use more than one core, and a single worker is also a single
  # point of failure for every in-flight request when it restarts.
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
