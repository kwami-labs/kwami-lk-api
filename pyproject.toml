[project]
name = "kwami-lk-api"
version = "0.1.1"
description = "LiveKit token endpoint API for Kwami AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "livekit-api>=1.0.0",
    "livekit-agents>=1.0.0",
    "python-dotenv>=1.0.0",
    "zep-cloud>=3.0.0",
    "pyyaml>=6.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    # LiveKit plugins for model definitions extraction
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-anthropic>=1.0.0",
    "livekit-plugins-google>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-elevenlabs>=1.0.0",
    "livekit-plugins-cartesia>=1.0.0",
    "livekit-plugins-groq>=1.0.0",
    "livekit-plugins-mistralai>=1.0.0",
    "livekit-plugins-rime>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    # Note: AWS plugin requires aws-sdk-bedrock-runtime for full functionality
    # Model listing uses fallback, so plugin is optional
    # Credits & payments
    #
    # >=15 is a real floor, not a formality. stripe 15 stopped making StripeObject a
    # subclass of dict, and src/services/stripe_service.py is written against that: it
    # calls `.to_dict()` on the verified webhook event and works in plain dicts below.
    # The declared floor said >=8, where the same code path silently behaved differently.
    "stripe>=15.0.0",
    "supabase>=2.0.0",
    "twilio>=9.8.0",
    "phonenumbers>=8.13.55",
    "python-multipart>=0.0.20",
    # Graph analysis for memory operations
    "networkx>=3.2.0",
    "python-louvain>=0.16",
    "thefuzz[speedup]>=0.22.0",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
# NOTE: pytest-asyncio is deliberately absent. The suite drives async tests through
# the anyio plugin (`@pytest.mark.anyio` + the session `anyio_backend` fixture), and
# Starlette/httpx are anyio-native. Two async plugins competing to collect the same
# coroutine is a real source of silently-skipped tests, not a style preference.
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.15.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "respx>=0.22.0",          # httpx transport: supabase/postgrest, zep, sendgrid
    "responses>=0.25.0",      # requests transport: stripe, twilio
    "aioresponses>=0.7.6",    # aiohttp transport: livekit twirp
    "freezegun>=1.5.0",
    "dirty-equals>=0.8.0",
    "ruff>=0.8.0",
    "mypy>=2.3.1",
]
integration = [
    "testcontainers[postgres]>=4.8.0",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
kwami-api = "src.main:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ASYNC (flake8-async) is what keeps the async-I/O work from regressing: it flags
# blocking HTTP/file/sleep calls inside `async def`, which is the defect class that
# made every Supabase call stall the event loop.
# G and TRY400 are the two that keep production diagnosable: `G` forbids
# f-string log messages, which an aggregator cannot group and which pay their
# formatting cost even at a suppressed level; `TRY400` catches `logger.error`
# inside an `except`, which silently drops the traceback -- it was doing so on 39
# paths. `S` is flake8-bandit, which `per-file-ignores` below has referred to
# since it was written without the rule set ever being selected.
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "S", "G", "TRY", "DTZ", "RET", "SIM", "C4"]
ignore = [
    "E501",
    # Ruff wants every exception message in a named constant. That is a style
    # this codebase does not follow, and the messages here are deliberately
    # written at the raise site so the reason is readable where it is thrown.
    "TRY003",
    # `try/except/else` where the happy path trails the try. Reads worse than the
    # straight-line version in this codebase's handlers.
    "TRY300",
    # Re-raising inside a try is how the webhook handlers distinguish a duplicate
    # from a real failure.
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# assert is what a test is made of; a fixture's "secret" is inert; the fixed
# timestamps in the reconciliation fixtures are deliberately naive so the
# conversion under test is the thing being exercised; and the integration
# harness shells out to scripts/migrate.py on purpose.
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "DTZ001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is function calls in argument defaults;
# B008 is a false positive for every one of them.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Without it, mypy cannot see that pydantic-settings fills every field from the
# environment, so it reports `Settings()` as missing the required LiveKit
# arguments, and it does not understand `@computed_field` over `@property`.
plugins = ["pydantic.mypy"]
# Third-party SDKs here ship partial or no stubs (livekit, zep_cloud, supabase,
# twilio). Their absence is not a finding about this codebase.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# The defect class that matters right after the async migration: a forgotten
# `await` leaves a Coroutine where a value is expected, and this is the check
# that names it.
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true
# `@computed_field` over `@property` is the documented pydantic idiom and mypy
# has no representation for a decorator above a property. Four sites in config.py.
disable_error_code = ["prop-decorator"]

# ---- The ratchet -----------------------------------------------------------
#
# These modules do not type-check yet. They are listed one by one, with their
# error count at the time of writing, rather than hidden behind a repo-wide
# `ignore_errors` that nobody ever revisits: a list that names its debts is a
# list someone can pay down, and deleting an entry is a visible, reviewable act.
#
# The two rules: an entry may be deleted, never added. A new module type-checks
# from the day it is written.
[[tool.mypy.overrides]]
module = [
    "src.services.wallet_service",      # 155
    "src.api.routes.memory.analysis",   # from the 86 the old memory.py carried
    "src.api.routes.memory.core",
    "src.api.routes.memory.graph",
    "src.api.routes.memory.ontology",
    "src.services.memory.graph",
    "src.services.credits",             #  38
    "src.main",                         #  18
    "src.services.admin_reconciliation",#  16
    "src.api.routes.models",            #   6
    "src.api.routes.credits",           #   6
    "src.services.stripe_service",      #   3
    "src.api.routes.token",             #   3
    "src.services.twilio_service",      #   2
    "src.services.telephony",           #   2
    "src.services.kwamis",              #   2
    "src.services.channels",            #   2
    "src.services.voices",              #   1
    "src.services.sendgrid_service",    #   1
    "src.services.calendar_service",    #   1
]
ignore_errors = true

# Strict where the money and the auth decisions are. The list widens module by
# module rather than repo-wide, because a repo-wide `ignore_errors` that never
# shrinks is the same as having no type checker.
[[tool.mypy.overrides]]
module = [
    "src.core.config",
    "src.core.errors",
    "src.core.logging",
    "src.core.security",
    "src.api.middleware",
    "src.api.ratelimit",
    "src.services.pricing",
    "src.services.idempotency",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The project is run as `python -m src.main` rather than installed, so the repo
# root must be importable. Setting it here makes `pytest` and `python -m pytest`
# behave identically -- `uv run pytest` does not add the CWD on its own.
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--durations=10",
]
markers = [
    "unit: fast, no network, no database (the default)",
    "integration: requires Postgres + PostgREST",
    "e2e: requires the full docker-compose stack",
    "slow: takes more than one second",
]
# A test marked xfail that starts passing is a fix that shipped without anyone
# removing the marker -- fail, so the marker cannot go stale.
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:livekit.*",
    "ignore::DeprecationWarning:google.*",
    # google-auth warns about its October 2026 grpcio floor on the grpc transport
    # import, which the Gemini voice extractor triggers lazily. A FutureWarning
    # rather than a DeprecationWarning, so the line above does not catch it.
    "ignore::FutureWarning:google.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:websockets.*",
]
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
relative_files = true
omit = ["src/**/__init__.py"]

[tool.coverage.paths]
source = ["src", "/app/src"]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def run\\(\\):",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]
